spring.application.name=denticare

#===================================
# CONEXION A POSTGRESQL (Denticare)
#===================================

spring.datasource.url=jdbc:postgresql://localhost:5432/denticare_db
spring.datasource.username=postgres
spring.datasource.password=admin

#===================================
# CONFIGURACION DE HIBERNATE / JPA
#===================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.databade-platform=org.hibernate.dialect.PostgreSQLDialect

spring.security.user.name=admin
spring.security.user.password=admin123

# ddl-auto=update le ordena a Java que lea mis @Entity 
# y automáticamente cree o actualice las tablas en PostgreSQL si no existen.
spring.jpa.hibernate.ddl-auto=update

# Esta línea es para que la terminal me muestre el código SQL que Java está escribiendo por detrás.
spring.jpa.show-sql=true